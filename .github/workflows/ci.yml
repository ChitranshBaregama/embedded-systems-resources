name: build and test

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    name: host unit tests (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: make -C code/host-tests

  qemu-examples:
    name: bare-metal examples under QEMU
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi qemu-system-arm
      # Build the portable layer FIRST, on purpose. It leaves Cortex-M4
      # objects next to their sources, which is the exact condition that
      # used to make the examples' Cortex-M3 build pick up a stale object
      # through VPATH. Reproducing it here stops that regressing.
      - name: Build the portable layer first (regression guard)
        run: make -C code/portable

      - name: Build and run every example
        run: code/qemu-cortex-m/run-all.sh

  portable-cross-compile:
    name: portable layer builds for Cortex-M4 and M0+
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Cortex-M4
        run: make -C code/portable
      - name: Cortex-M0+
        run: make -C code/portable m0

  stm32-compile:
    name: stm32f4 drivers compile clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Compile
        run: make -C code/stm32f4

  links:
    name: no broken links or anchors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every relative markdown link resolves
        run: python3 scripts/check-links.py
